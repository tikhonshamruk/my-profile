<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Layout</title>
    <link rel="stylesheet" href="modern-normalize.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style320.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="../modal.css">
</head>
<body>
    <header>
        <div class="header-wrapper">
            <div class="header__inner header__inner--left">
                <div class="header__inner__rotate">
                    <div class="social-network">
                        <img class="social-network__icon" src="../../assets/icons/Github (1).svg" alt="GitHub">
                         <img class="social-network__icon" src="../../assets/icons/Instagram.svg" alt="Instagram">
                         <img class="social-network__icon" src="../../assets/icons/Facebook.svg" alt="Facebook">
                     </div>
                     <div class="header__divider"></div>
                    <h1 class="header__title">Социальные сети</h1>
                    
                    
            
                </div>
            </div>
            
            <div class="header__inner header__inner--center"> 
                <h1 class="metka ml">Меня зовут Александра Смит</h1>
                <h2>Я web-разработчик из города Москва</h2>
                <div>
                    <button class="btn">Портфолио</button>
                <button class="btn">Про меня</button>
                </div>
            </div>
                <div class="header__inner header__inner--right">
                    <div class="burger-menu">
                        <div class="burger-menu__icon">
                            <span class="burger-menu__line"></span>
                            <span class="burger-menu__line burger-menu__medium-line"></span>
                            <span class="burger-menu__line"></span>
                        </div>
                    </div>
                </div>
                
                    <div class="navigation-wrapper">
                        <div class="navigation-wrapper__left">
                            <div class="navigation__burger-menu">
    
                            </div>
                            <nav class="navigation-wrapper__link">
                                <li>
                                    <a href="" class="navigation-link">ПРО МЕНЯ</a>
                                </li>
                                <li>
                                    <a href="" class="navigation-link">МОЙ ОПЫТ</a>
                                </li>
                                <li>
                                    <a href="" class="navigation-link">МОИ НАВЫКИ</a>
                                </li>
                                <li>
                                    <a href="" class="navigation-link">МОИ РАБОТЫ</a>
                                </li>
                                <li>
                                    <a href="" class="navigation-link">ПРАЙС-ЛИСТ</a>
                                </li>
                                <li>
                                    <a href="" class="navigation-link">КОНТАКТЫ</a>
                                </li>
                            </nav>
    
                            <div>
    
                            </div>
                        </div>
                        <div class="navigation-wrapper__right"></div>
                    </div>
                
        </div>
    </header>
    <div class="body-wrapper">
        <footer class="footer">
            <div class="footer-image">
                <img src="../../assets/img/Photo.jpg" alt="">
            </div>
            <div class="footer-form">
                <h1 class="metka">Контакты</h1>
                <h2>Свяжитесь со мной</h2>
                <div class="footer-divide"></div>
                <h3>Любым удобным для вас способом:</h3>
                <div class="footer-icon">
                    <img src="../../assets/icons/Facebook.svg" alt="">
                    <img src="../../assets/icons/Github (1).svg" alt="">
                    <img src="../../assets/icons/Instagram.svg" alt="">
                </div>
                <h3>Или оставьте ваши данные и я сама вам напишу:</h3>
                
                <form id="contact-form">
                    <div class="form-group">
                        <label for="name">Ваше имя:</label>
                        <input type="text" id="name" name="name" required>
                        <span class="error-message" id="name-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">Ваш email:</label>
                        <input type="email" id="email" name="email" required>
                        <span class="error-message" id="email-error"></span>
                    </div>
                    <div class="form-group">
                        <label for="message">Ваше сообщение:</label>
                        <textarea id="message" name="message" required></textarea>
                        <span class="error-message" id="message-error"></span>
                    </div>
                    <button class="btn" type="submit">Отправить сообщение</button>
                </form>
            </div>
        </footer>
    </div>
</body>
<script src="script.js"></script>
</html>
